name: Build Windows app and MSI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (major.minor.patch)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } elseif ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { '0.1.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a version such as 0.1.0 or a tag such as v0.1.0.' }
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) { throw 'Version exceeds Windows Installer limits.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained Windows EXE
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: ./build.ps1 -Version $env:BUILD_VERSION
      - name: Run simulated audio and window checks
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build MSI and release files
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/package.ps1 -Version $env:BUILD_VERSION
      - name: Test MSI install and uninstall on the disposable runner
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/test-installer.ps1 -MsiPath "$PWD/artifacts/release/GuitarBridge-$env:BUILD_VERSION-win-x64.msi" -PublishedExecutable "$PWD/artifacts/publish/GuitarBridge.exe"
      - name: Upload Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GuitarBridge-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/release/*.exe
            artifacts/release/*.msi
            artifacts/release/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GuitarBridge-${{ needs.build.outputs.version }}-win-x64
          path: release
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/*.msi release/SHA256SUMS.txt --verify-tag --title "Guitar Bridge $GITHUB_REF_NAME" --generate-notes
